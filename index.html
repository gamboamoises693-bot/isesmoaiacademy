t client artifact can be live in 90 minutes.",exercise:"List 3 niches you know or have access to (e.g., salon owners, coaches, Airbnb hosts). For each, write 1 pain point that a dashboard could solve."}]},{id:2,title:"Prompt Engineering Mastery",desc:"Copy-paste prompts that build premium artifacts",lessons:[{id:"2-1",moduleId:2,title:"The Artifact Prompt Formula",duration:"26 min",type:"audio",content:"Formula: ROLE + OUTCOME + VISUAL SPEC + INTERACTION RULES + DEPLOYMENT. Example: 'You are a SaaS designer. Build a salon booking artifact that looks like Linear.app. Purple #4A2C82, gold #D4AF37 accents, glass cards, real-time availability...' This structure gets 90% perfect artifacts on first try.",prompt:`ROLE: You are a senior product designer for luxury brands.

",moduleId:4,title:"DM Closing Framework",duration:"20 min",type:"audio",content:"DM flow: 1) Qualification: 'What system are you using now?' 2) Pain amplify: 'How many hours/week on manual booking?' 3) Demo: Send Loom + link. 4) Price anchor: 'Similar system was ₱15k, yours is ₱9k since you're referral.' 5) Urgency: 'I can start tomorrow, deliver Friday.' Close rate: 40%."}]},{id:5,title:"Pricing & Negotiation",desc:"Charge premium without sounding expensive",lessons:[{id:"5-1",moduleId:5,title:"The 3-Tier Pricing",duration:"16 min",type:"text",content:"Never sell one price. Tier 1: Basic Artifact ₱5k (single page). Tier 2: Pro ₱10k (+ admin panel, mobile app feel). Tier 3: Business ₱18k (+ custom domain, training, 30-day support). 70% pick Tier 2. This is psychology: Tier 3 makes Tier 2 feel smart."},{id:"5-2",moduleId:5,title:"Handling 'Mahal Naman'",duration:"12 min",type:"audio",content:"When they say mahal, they mean 'not sure about ROI'. Reply: 'Gets kita. Let's compute: If this saves 5 hrs/week at ₱300/hr, that's ₱6k/month saved. ROI in 2 months, then profit after. And you own it forever, no monthly fee.' Works 80% of time. Include GCash installment option: 2x ₱5k."}]},{id:6,title:"Scale to ₱100k/month",desc:"Systems to get 10 clients without burnout",lessons:[{id:"6-1",moduleId:6,title:"Template Library System",duration:"21 min",type:"text",content:"Build once, sell 10x. Save your top 5 artifacts as templates. Change colors, logo, and niche text only. A salon booking becomes a clinic booking in 20 minutes. Track templates in Notion: Niche | Pain | Price | Link | Client name. Goal: 2 new templates per week."},{id:"6-2",moduleId:6,title:"From Freelancer to Agency",duration:"28 min",type:"audio",content:"Hire 1 junior to handle polish & deployment (₱15k/mo). You focus on sales & prompt. Package as 'Isesmo Studio'. Offer retainer: ₱3k/mo for updates. 10 clients x ₱3k = ₱30k recurring. Add this after 5 one-off projects. Includes contract template and onboarding
