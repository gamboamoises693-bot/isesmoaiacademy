k, format.",descTL:"Ayusin ang prompts para premium output lagi. Context, role, task, at format.",lessons:[{id:"m2l1",titleEN:"The 4-Layer Prompt",titleTL:"Ang 4-Layer Prompt",contentEN:"Top prompts use: 1) Context - who you are 2) Role - who Claude should be 3) Task - exact deliverable 4) Format - how it should look. This eliminates generic outputs.",contentTL:"Ang magandang prompt may: 1) Context - sino ka 2) Role - sino si Claude 3) Task - eksaktong gagawin 4) Format - itsura ng output. Iwas generic.",exerciseEN:"Rewrite a weak prompt using 4 layers. Before and after.",exerciseTL:"I-rewrite ang mahinang prompt gamit ang 4 layers. Before at after."},{id:"m2l2",titleEN:"Examples Over Instructions",titleTL:"Halimbawa Higit sa Instructions",contentEN:"Show, don't just tell. Provide 2-3 examples of ideal outputs. Claude copies style instantly.",contentTL:"Magpakita, hindi lang magsabi. Magbigay ng 2-3 halimbawa ng ideal output. Gagayahin agad ni Claude ang style.",exerciseEN:"Pick one business document and create 2 gold-standard examples for Claude to replicate.",exerciseTL:"Pumili ng isang business document at gumawa ng 2 gold-standard examples para gayahin ni Claude."}]},{id:"m3",num:3,titleEN:"Business Use Cases",titleTL:"Gamit sa Negosyo",descEN:"Apply Claude to marketing, SOPs, sales, and client delivery with templates.",descTL:"Gamitin si Claude sa marketing, SOPs, sales, at client delivery gamit ang templates.",lessons:[{id:"m3l1",titleEN:"Marketing & Content Engine",titleTL:"Marketing at Content Engine",contentEN:"Build a 30-day content system: 1 idea -> 5 formats. Claude repurposes, adapts tone for EN/TL, and keeps brand voice consistent.",contentTL:"Bumuo ng 30-day content system: 1 idea -> 5 formats. Si Claude ang mag-repurpose, mag-adapt ng EN/TL, at magpanatili ng brand voice.",exerciseEN:"Map your content pillar and generate 5 derivative posts from one core idea.",exerciseTL:"I-map ang content pillar mo at gumawa ng 5 posts mula sa isang core idea."},{id:"m3l2",titleEN:"SOPs & Operations",titleTL:"SOPs at Operasyon",contentEN:"Document any process in 15 minutes. Loom transcript -> Claude -> SOP with checklist, owners, and automation triggers.",contentTL:"I-document ang kahit anong proseso sa 15 minuto. Loom transcript -> Claude -> SOP na may checklist, owners, at automation triggers.",exerciseEN:"Record a 3-minute Loom of a task you do manually and turn it into an SOP draft.",exerciseTL:"Mag-record ng 3-minutong Loom ng mano-manong gawain at gawing SOP draft."}]},{id:"m4",num:4,titleEN:"Advanced Workflows",titleTL:"Advanced Workflows",descEN:"Chain tasks, use Projects deeply, and create repeatable client systems.",descTL:"I-chain ang tasks, gamitin nang malalim ang Projects, at gumawa ng repeatable client systems.",lessons:[{id:"m4l1",titleEN:"Project Stacking",titleTL:"Project Stacking",contentEN:"Create client or offer-specific Projects. Each Project holds: brand guide, past outputs, objections, and templates. Claude becomes your specialist.",contentTL:"Gumawa ng Projects per client o offer. Bawat Project may: brand guide, past outputs, objections, at templates. Magiging specialist si Claude.",exerciseEN:"Design 2 Projects: one for your main offer, one for your personal productivity.",exerciseTL:"Mag-design ng 2 Projects: isa para sa main offer mo, isa para sa personal productivity."},{id:"m4l2",titleEN:"Thinking & Review Loops",titleTL:"Thinking at Review Loops",contentEN:"Use extended thinking for strategy, then ask Claude to critique its own output against 3 criteria: clarity, revenue impact, executability.",contentTL:"Gamitin ang extended thinking para sa strategy, tapos ipacritique kay Claude ang sariling output base sa 3 criteria: clarity, revenue impact, executability.",exerciseEN:"Run a review loop: generate, critique, improve. Save the best version.",exerciseTL:"Mag-run ng review loop: generate, critique, improve. I-save ang pinakamagandang version."}]},{id:"m5",num:5,titleEN:"Automation",titleTL:"Automation",descEN:"Connect Claude to your tools. From manual to automated delivery.",descTL:"Ikonekta si Claude sa tools mo. Mula manual patungong automated delivery.",lessons:[{id:"m5l1",titleEN:"Claude + Your Stack",titleTL:"Claude + Stack Mo",contentEN:"Map triggers: Gmail, Sheets, Notion, Slack. Use Claude API or MCP to automate reports, drafts, and research that used to take hours.",contentTL:"I-map ang triggers: Gmail, Sheets, Notion, Slack. Gamitin ang Claude API o MCP para i-automate ang reports, drafts, at research.",exerciseEN:"List 3 automations you want live in 30 days. Define input, Claude task, output.",exerciseTL:"Maglista ng 3 automations na gusto mong live sa 30 araw. I-define ang input, Claude task, output."},{id:"m5l2",titleEN:"Delegation System",titleTL:"Sistema ng Delegation",contentEN:"Build prompts your VA or team can run without you. Packaged intelligence that scales your operations.",contentTL:"Gumawa ng prompts na kayang patakbuhin ng VA o team mo nang wala ka. Packaged intelligence na nag-scale ng operations mo.",exerciseEN:"Create one delegation prompt pack: role, context, steps, quality check.",exerciseTL:"Gumawa ng isang delegation prompt pack: role, context, steps, quality check."}]},{id:"m6",num:6,titleEN:"Final Project + Certificate",titleTL:"Final Project + Sertipiko",descEN:"Build your signature system and claim your certificate.",descTL:"Buuin ang signature system mo at kunin ang sertipiko mo.",lessons:[{id:"m6l1",titleEN:"Signature System Build",titleTL:"Buuin ang Signature System",contentEN:"Combine everything: one Project that delivers a complete business asset — campaign, SOP vault, or client portal — ready to sell or implement.",contentTL:"Pagsamahin lahat: isang Project na nagde-deliver ng buong business asset — campaign, SOP vault, o client portal — ready ibenta o i-implement.",exerciseEN:"Deliver your final project link or description. What business outcome does it create?",exerciseTL:"I-deliver ang final project link o descrip
