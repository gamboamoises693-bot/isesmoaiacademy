ask + Context + Format. This structure gives you consistent, high-quality outputs.",contentTl:"Makinig ka boss. Gamitin mo itong formula: Role + Task + Context + Format. Halimbawa: 'Ikaw ay expert Facebook Ads copywriter. Gumawa ka ng 3 ad copy para sa milktea shop ko na nasa Quezon City, pang Gen Z ang tone.' Kita mo? Malinaw yung utos kaya maganda yung resulta. Hindi yung 'gawan mo ako ng ad' lang. Detalye ang labanan dito.",duration:"18 min"},{id:"m1-l3",title:"Avoid AI Hallucination",titleTl:"Iwasan ang Maling AI",content:"Always verify facts. Ask AI to cite sources and show reasoning.",contentTl:"Tandaan mo ito, hindi lahat ng sinasabi ng AI ay totoo. Minsan nag-iimbento siya, boss. Kaya dapat lagi mong sabihin: 'Magbigay ka ng source at ipaliwanag mo step-by-step.' Wag kang basta maniwala. Ikaw pa rin ang boss, siya lang ang katulong mo.",duration:"10 min"}]},{id:"m2",title:"AI Automation for Business",titleTl:"AI Automation sa Negosyo",desc:"Automate FB replies, content, at client work - para kumita kahit tulog ka.",lessons:[{id:"m2-l1",title:"Auto Content System",titleTl:"Auto Content System",content:"Create 30 days of content in 1 hour using AI pipelines.",contentTl:"Boss, pagod ka na ba kakaisip ng content araw-araw? Dito sa lesson na to, tuturuan kita paano gumawa ng 30 days na content sa loob lang ng isang oras. Gamit ang AI, gagawa tayo ng content calendar, caption, at hashtag. Hindi mo na kailangan mag-isip araw-araw. Isang upuan lang, tapos na isang buwan mong post. Ganyan dapat mag-negosyo.",duration:"22 min"},{id:"m2-l2",title:"Client Chatbot Setup",titleTl:"Chatbot para sa Client",content:"Build a messenger bot that answers FAQs and captures leads.",contentTl:"Alam mo ba, yung mga customer mo sa Facebook, nagtatanong ng paulit-ulit? 'Magkano po? Saan po location?' Pwede na yan sagutin ng AI chatbot mo habang natutulog ka. Hindi mo na kailangan bantayan yung inbox buong araw. Yung bot na mismo ang magko-close ng sale para sayo. Ako mismo ginagamit ko to sa mga estudyante ko.",duration:"25 min"},{id:"m2-l3",title:"No-Code Automation",titleTl:"Automation na Walang Code",content:"Connect Gmail, Sheets, FB with Make or Zapier + AI.",contentTl:"Hindi mo kailangan marunong mag-code para mag-automate. Gamit ang Make.com o Zapier, pwede mong pagdugtungin yung Gmail, Google Sheets, at Facebook Page mo. Pag may nag-message, automatic mapupunta sa Sheets, tapos may auto-reply. Parang may empleyado ka na robot. Tipid sa tao, tipid sa oras, pero tuloy ang kita.",duration:"20 min"}]},{id:"m3",title:"Monetize AI Skills - ₱299 to ₱10k",titleTl:"Kumita Gamit AI Skills",desc:"From 299 to 10k - offer AI services sa local business.",lessons:[{id:"m3-l1",title:"Find Your First 3 Clients",titleTl:"Hanapin ang Unang 3 Client",content:"Target milktea shops, salons, clinics. Offer AI content package for 3k.",contentTl:"Boss, wag ka muna mag-isip ng malaking client. Simulan mo sa kapitbahay mong may negosyo. Yung milktea shop sa kanto, yung salon ni ate, yung clinic ni doc. Lapitan mo, sabihin mo: 'Ate, ako na bahala sa Facebook content mo, 3k lang per month, 15 posts na.' Gamit AI, 2 oras mo lang gagawin yun. Tatlong client lang, 9k na agad. Hindi ka na lugi sa 299 mo.",duration:"18 min"},{id:"m3-l2",title:"Pricing & Closing Script",titleTl:"Presyo at Paano Mag-Close",content:"Use the value-based script to close deals even if shy.",contentTl:"Nahihiya ka ba magbenta? Normal yan, boss. Pero ito yung script na ginagamit ko: 'Boss, nakita ko page niyo, ang ganda ng product pero kulang sa content. Paano kung ako mag-manage ng content niyo para dumami inquiries? May 3 package ako.' Tapos i-present mo. Hindi mo binebenta sarili mo, binibenta mo resulta. Pag nakita nila na dadami customer nila, sila pa maghahabol sayo.",duration:"16 min"},{id:"m3-l3",title:"GCash to BDO Scaling",titleTl:"Paano Lumaki ang Kita",content:"From GCash payments to retainer via bank.",contentTl:"Sa umpisa, GCash lang ok na. Pero pag may 5 clients ka na, kailangan mo na mag-BDO at mag-invoice. Para professional tignan. At para hindi ka mahirapan maningil, gawin mong retainer. Buwan-buwan may bayad sila sayo. Hindi per project lang. Ganyan lumalaki ang kita, boss. Hindi one-time, kundi buwan-buwan may pumapasok.",duration:"14 min"}]},{id:"m4",title:"Advanced AI Empire",titleTl:"Advanced AI Empire",desc:"Build agency, hire VA, run ads using AI.",lessons:[{id:"m4-l1",title:"Build Your AI Agency",titleTl:"Buuin ang AI Agency Mo",content:"Hire 1 VA from Upwork, train with your prompts.",contentTl:"Kapag kumikita ka na ng 20k per month, oras na para mag-hire ng VA. Isang VA lang muna, boss. Turuan mo ng mga prompt na natutunan mo dito. Siya gagawa ng content, ikaw maghahanap ng client. Ikaw ang utak, siya ang kamay. Ganyan lumalaki ang agency. Hindi mo kailangan gawin lahat mag-isa.",duration:"24 min"},{id:"m4-l2",title:"AI + FB Ads Combo",titleTl:"AI + FB Ads",content:"Use AI to write and test 10 ad angles in 1 day.",contentTl:"Yung mga nagpapa-FB Ads na nalulugi, kasi isa lang ang ad copy nila. Dito, tuturuan kita paano gumawa ng sampung version ng ad copy sa isang araw gamit ang AI. Iba-iba ang angle: pang nanay, pang estudyante, pang tambay. Tapos i-test mo lahat. Kung alin ang malakas, dun ka magdagdag ng budget. Hindi hula-hula, data ang basehan.",duration:"21 min"},{id:"m4-l3",title:"Graduation & Next Steps",titleTl:"Graduation at Susunod na Hakbang",content:"You are certified. Join private GC for job leads.",contentTl:"Congratulations, boss! Tapos mo na ang buong academy. Hindi ka na tulad ng dati na nagtataka paano kumita gamit ang AI. Ngayon may skill ka na. May certificate ka pa. At higit sa lahat, may kumpiyansa ka na. Hindi dito nagtatapos ang journey mo, dito pa lang nagsisimula. Sumali ka sa private GC namin para sa job leads at tuloy-tuloy na support. Proud ako sayo, boss!",duration:"10 min"}]}];function Lc(){return`CM-${Math.floor(1000+Math.random()*9000)}`}function E1(){let e=`${navigator.userAgent}|${screen.width}
