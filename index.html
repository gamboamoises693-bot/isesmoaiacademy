Laging ipakita muna ang live preview, saka banggitin ang presyo.`}}]},{id:2,title:{EN:"Prompt Engineering",TL:"Prompt Engineering"},desc:{EN:"Copy-paste prompts that build artifacts",TL:"Copy-paste prompts para gumawa ng artifacts"},lessons:[{id:"2-1",title:{EN:"The Perfect Artifact Prompt",TL:"Perfect Prompt Formula"},duration:"10 min",content:{EN:`Use this formula every time:

ROLE + TASK + CONTEXT + DESIGN + CONSTRAINTS

"You are a senior product designer. Create a luxury real estate ROI calculator for Filipino investors. Context: They need to compute monthly amortization, rental yield. Design: Minimal, editorial, gold and deep purple, Fraunces font for headings, Inter for body. Constraints: Single HTML file, mobile responsive, no console logs."

Copy-paste, change bracket parts only.`,TL:`Gamitin itong formula palagi:

ROLE + TASK + CONTEXT + DESIGN + CONSTRAINTS
