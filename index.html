 Context Window & Artifacts",time:"5 min read",content:["Think of context window as Claude's short-term memory. 200K tokens means you can paste an entire business plan, 20 customer reviews, and your pricing, and Claude still remembers the first line.","Rule: Always load context first, task second. Paste your business info, then ask for the task. Never the reverse.","Artifacts are the right panel that appears when Claude builds something. It can be a React app, an SVG, a markdown doc, or a CSV. You can copy, download, or publish it.","Pro tip: End every prompt with Format: Use an Artifact for the final output. This forces Claude to produce a usable file instead of plain text."]}],exercises:[{title:"Exercise 1.1 - Your First Business Consultant Prompt",duration:"7 min",prompt:`You are my business consultant specializing in small service businesses in the Philippines.
Context: I offer [YOUR NICHE - e.g. Facebook Ads for salons]. My target is local owners doing 50k-200k/month revenue.
Task: Create a 3-tier pricing table (Starter, Growth, Premium) with deliverables, timeline, and price in PHP.
Format: Use a clean Artifact with a table, include what is NOT included in each tier.
Constraint: No fluff, no emojis, business English only.`,steps:["Copy the exact prompt above","Replace [YOUR NICHE] with your actual niche","Paste into claude.ai new chat","Click Artifact when it appears and take a screenshot","Save the output as Module1_TierPricing.txt"],expected:"You should get a 3-column pricing table with clear deliverables. Starter around PHP 5k-8k, Growth 12k-18k, Premium 25k+. Each tier shows excluded items.",checklist:["I replaced my niche","I got an Artifact table","I saved the file","I understand why tiers work"]},{title:"Exercise 1.2 - Niche Modification Test",duration:"5 min",prompt:"Now modify the same prompt for a different niche: Use 'AI Automation for Real Estate Agents' as Context. Keep Role, Task, Format, Constraint identical. Run it again and compare which pricing model is more profitable.",steps:["Keep the same structure","Change only the Context line","Run second time in same chat","Compare both Artifacts side by side","Note 2 differences in pricing strategy"],expected:"Second output should adapt pricing to real estate (higher ticket, commission-based upsell). You learn how Context changes output without rewriting the whole prompt.",checklist:["I changed only Context","I compared two outputs","I wrote 2 learnings"]},{title:"Exercise 1.3 - Verification Checklist",duration:"3 min",prompt:`Prompt to test your understanding:

rporate speak.","Formula in action: Role + Context + Task + Format + Constraint = Client-ready output in one shot."]},{title:"Chain of Thought & Few-Shot Techniques",time:"7 min read",content:["Chain of Thought: Add Think step by step before answering. This increases accuracy by 40% for complex tasks. Prompt add-on: Before you answer, think step by step about the audience pain points, then create the output.","Few-Shot: Show 2 examples of what good looks like. Claude will match the style. Example: Here are 2 good headlines I like: 1) ... 2) ... Now create 10 more in same style.","Combine them: Give 2 examples (few-shot) + ask to think step by step (chain) + then produce 10 new items. This is how you get premium quality without editing.","Never use zero-shot for money tasks. Always give at least 1 example of your desired tone and structure."]},{title:"Using Artifacts to Build Apps in Claude",time:"5 min read",content:["Artifacts can build live tools: calculators, landing pages, dashboards. Client sees it as a product, not just text.","To trigger Artifact reliably: Say Build a single-file React component inside an Artifact. Use Tailwind classes. Make it mobile responsive.","You can then download the Artifact as HTML and send to client or host on Canva or Notion. No coding needed from you.","In Exercises below, you will build 3 real business tools you can sell for $99 each."]}],exercises:[{title:"Exercise 2.1 - Business Plan Generator App",duration:"6 min",prompt:`You are a startup strategist with 15 years experience funding SMEs in SE Asia.

const SHEET_NAME = "Customers";

function doPost(e) {
  try {
    const data = JSON.parse(e.postData.contents);
    const row = data.row;
    const clean = row.map(v => String(v).replace(/,/g, " "));
    const ss = SpreadsheetApp.openById(SHEET_ID);
    let sheet = ss.getSheetByName(SHEET_NAME);
    if (!sheet) {
      sheet = ss.insertSheet(SHEET_NAME);
      sheet.appendRow(["Timestamp","FullName","AccessCode","FirstLogin","LastActive","Progress","DeviceID","DeviceModel","ModulesCompleted","Status"]);
    }
    sheet.appendRow(clean);
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ok:false, err: String(err)})).setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet() {
  try {
    const ss = SpreadsheetApp.openById(SHEET_ID);
    const sheet = ss.getSheetByName(SHEET_NAME);
    if (!sheet) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
    const values = sheet.getDataRange().getValues();
    const rows = values.slice(1).map(r => ({
      timestamp: r[0], fullName: r[1], accessCode: r[2], firstLogin: r[3], lastActive: r[4], progress: r[5], deviceId: r[6], deviceModel: r[7], modulesCompleted: r[8], status: r[9]
    }));
    return ContentService.createTextOutput(JSON.stringify(rows)).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
