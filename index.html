var SHEET_ID = "1D37D2j9_bjAXh4l6qvI0Ct3106qdlvx_SATHW13GDfc";

function doPost(e) {
  try {
    var ss = SpreadsheetApp.openById(SHEET_ID);
    var sheet = ss.getSheets()[0];
    
    // Fix headers if missing - EXACT 10 COLUMNS
    if (sheet.getLastRow() === 0) {
      sheet.appendRow(["Timestamp","Full Name","Access Code","First Login","Last Active","Progress %","Completed Lessons","Certificate","Device ID","User Agent"]);
    }
    
    var data = JSON.parse(e.postData.contents);
    
    // Clean commas to prevent sheet break - keep 10 columns exact
    function clean(v){
      if(v === null || v === undefined) return "";
      return String(v).replace(/,/g, " ").replace(/\\n/g, " ").substring(0, 500);
    }
    
    var row = [
      clean(data.timestamp),
      clean(data.name),
      clean(data.code),
      clean(data.firstLogin),
      clean(data.lastActive),
      clean(data.progress),
      clean(data.completedLessons),
      clean(data.certificate),
      clean(data.deviceId),
      clean(data.userAgent)
    ];
    
    sheet.appendRow(row);
    
    return ContentService.createTextOutput(JSON.stringify({result:"success", row: sheet.getLastRow()}))
      .setMimeType(ContentService.MimeType.JSON);
      
  } catch(err){
    return ContentService.createTextOutput(JSON.stringify({result:"error", message: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e){
  try{
    var ss = SpreadsheetApp.openById(SHEET_ID);
    var sheet = ss.getSheets()[0];
    var data = sheet.getDataRange().getValues();
    var headers = data[0];
    var rows = [];
    for(var i=1;i<data.length;i++){
      var obj = {};
      for(var j=0;j<headers.length;j++){
        obj[headers[j]] = data[i][j];
      }
      rows.push(obj);
    }
    return ContentService.createTextOutput(JSON.stringify(rows))
      .setMimeType(ContentService.MimeType.JSON);
