var HEADERS = ["Timestamp","Full Name","Access Code","First Login","Last Active","Progress %","Completed Lessons","Certificate","Device ID","User Agent"];

function doPost(e){
  try{
    var sheet = SpreadsheetApp.openById(SHEET_ID).getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    // FIX: Remove commas to prevent sheet breaking
    function clean(v){
      if(v===undefined || v===null) return "";
      return v.toString().replace(/,/g, " ");
    }
    
    var row = [
      clean(data.timestamp || new Date().toLocaleString()),
      clean(data.name),
      clean(data.code),
      clean(data.firstLogin),
      clean(data.lastActive),
      clean(data.progress || 0),
      clean(data.completedLessons || ""),
      clean(data.certificate || "NO"),
      clean(data.deviceId || ""),
      clean(data.userAgent || "")
    ];
    
    sheet.appendRow(row);
    return ContentService.createTextOutput(JSON.stringify({result:"success", row: row}))
      .setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({result:"error", error: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e){
  try{
    var action = e.parameter.action;
    var sheet = SpreadsheetApp.openById(SHEET_ID).getActiveSheet();
    
    if(action == "read"){
      var rows = sheet.getDataRange().getValues();
      var out = [];
      for(var i=1;i<rows.length;i++){
        var obj = {};
        for(var j=0;j<HEADERS.length;j++){
          obj[HEADERS[j]] = rows[i][j];
        }
        out.push(obj);
      }
      return ContentService.createTextOutput(JSON.stringify(out))
        .setMimeType(ContentService.MimeType.JSON);
    }
    
    if(action == "fix"){
      sheet.clear();
      sheet.appendRow(HEADERS);
      return ContentService.createTextOutput(JSON.stringify({result:"headers fixed", headers: HEADERS}))
        .setMimeType(ContentService.MimeType.JSON);
    }
    
    return ContentService.createTextOutput(JSON.stringify({result:"ok", message:"Use ?action=read or ?action=fix"}))
      .setMimeType(ContentService.MimeType.JSON);
      
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({result:"error", error: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}
