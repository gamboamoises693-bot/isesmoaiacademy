In this lesson you'll learn:
- Claude's architecture strengths
- How it differs from ChatGPT
- Real-world use cases for freelancers

Key principle: Treat Claude as a thought partner, not just a tool. The better your context, the better its output.`,contentTL:`Si Claude ay ang pinakamakapangyarihang AI assistant ng Anthropic. Hindi tulad ng ordinaryong chatbot, magaling si Claude sa malalim na pag-iisip, mahabang konteksto, at ligtas na sagot.

Sa araling ito matututunan mo:
- Kalakasan ng arkitektura ni Claude
- Pagkakaiba niya sa ChatGPT
- Tunay na gamit para sa freelancer

Pangunahing prinsipyo: Ituring si Claude bilang ka-partner sa pag-iisip, hindi lang tool. Mas malinaw ang konteksto mo, mas maganda ang resulta.`,exerciseEN:"You are a Filipino small business owner. Write a prompt that makes Claude act as your business coach. Include: your niche, your goal, and ask for 3 actionable steps.",exerciseTL:"Ikaw ay may-ari ng maliit na negosyo. Gumawa ng prompt na magpapakilos kay Claude bilang business coach mo. Isama: ang niche mo, ang goal mo, at humingi ng 3 konkretong hakbang.",xp:50},{id:"l2",titleEN:"Setting Up Your Secure Workspace",titleTL:"Pag-setup ng Ligtas na Workspace",contentEN:`Security first. We'll set up:
1. A dedicated Claude.ai account
2. Project organization with folders
3. Prompt library system

Pro Tip: Create 3 projects: Client Work, Personal Learning, Templates. Never mix client data.`,contentTL:`Seguridad muna. Ise-setup natin:
1. Sariling Claude.ai account
2. Maayos na pag-organize ng project gamit ang folders
3. Sistema ng prompt library

Pro Tip: Gumawa ng 3 proyekto: Client Work, Personal Learning, Templates. Huwag paghaluin ang data ng kliyente.`,exerciseEN:"Create your folder structure now. Write the exact names you'll use for your 3 Claude Projects.",exerciseTL:"Gawin mo na ang folder structure mo. Isulat ang eksaktong pangalan ng 3 Claude Projects na gagamitin mo.",xp:50}]},{id:"m2",titleEN:"Module 2: Prompt Engineering Basics",titleTL:"Module 2: Batayan ng Prompt Engineering",descEN:"Write prompts that deliver",descTL:"Sumulat ng prompts na may resulta",lessons:[{id:"l3",titleEN:"The 4-Part Formula",titleTL:"Ang 4-Part na Formula",contentEN:`Every high-converting prompt has: ROLE + CONTEXT + TASK + FORMAT

Example:
ROLE: You are a senior copywriter...
CONTEXT: For a skincare brand targeting Gen Z...
TASK: Write 5 FB ad hooks...
FORMAT: In Taglish, under 15 words each.`,contentTL:`Bawat epektibong prompt ay may: ROLE + CONTEXT + TASK + FORMAT

Halimbawa:
ROLE: Ikaw ay senior copywriter...
CONTEXT: Para sa skincare brand na pang-Gen Z...
TASK: Sumulat ng 5 FB ad hooks...
FORMAT: Sa Taglish, wala pang 15 salita bawat isa.`,exerciseEN:`ROLE: You are Isesmo Gamboa, a Claude Mastery coach.
CONTEXT: Student is a beginner VA.
TASK: Explain why Claude is better for long docs.
FORMAT: Bullet list, friendly Taglish.`,exerciseTL:`ROLE: Ikaw si Isesmo Gamboa, Claude Mastery coach.
CONTEXT: Baguhan na VA ang estudyante.
TASK: Ipaliwanag bakit mas maganda si Claude sa mahabang dokumento.
FORMAT: Bullet list, friendly Taglish.`,xp:75},{id:"l4",titleEN:"Context Stacking",titleTL:"Pagpapatong ng Konteksto",contentEN:`Don't dump everything at once. Stack context in layers:
1. Who you are
2. What you have
3. What you want
4. What good looks like

This prevents Claude from hallucinating and increases accuracy by 40%.`,contentTL:`Huwag ibuhos lahat nang sabay. I-layer ang konteksto:
1. Sino ka
2. Anong meron ka
3. Anong gusto mo
4. Anong itsura ng magandang resulta

Maiiwasan ang hallucination at tataas ang accuracy ng 40%.`,exerciseEN:"Take your previous business coach prompt. Now stack it: Add who you are, what data you have, and 1 example of good output.",exerciseTL:"Balikan ang business coach prompt mo. I-stack mo na: Idagdag kung sino ka, anong data meron ka, at 1 halimbawa ng magandang output.",xp:75}]},{id:"m3",titleEN:"Module 3: Advanced Claude Techniques",titleTL:"Module 3: Advanced na Teknik sa Claude",descEN:"Artifacts, reasoning, and long context",descTL:"Artifacts, reasoning, at mahabang konteksto",lessons:[{id:"l5",titleEN:"Artifacts for Clients",titleTL:"Artifacts para sa Kliyente",contentEN:`Claude Artifacts let you create interactive deliverables: calculators, dashboards, landing pages. Clients pay 3x more for interactive vs text.

Prompt: "Create a React artifact for..." and Claude will build it live.`,contentTL:`Ang Claude Artifacts ay nagbibigay-daan na gumawa ng interactive deliverables: calculator, dashboard, landing page. Mas malaki ng 3x ang bayad ng kliyente sa interactive kaysa text lang.

Prompt: "Create a React artifact for..." at bubuoin ito ni Claude nang live.`,exerciseEN:'Prompt Claude: "Build a GCash fee calculator artifact. Inputs: amount. Output: fee + total. Purple theme."',exerciseTL:'I-prompt si Claude: "Gumawa ng GCash fee calculator artifact. Input: amount. Output: fee + total. Purple theme."',xp:100},{id:"l6",titleEN:"Extended Thinking Mode",titleTL:"Extended Thinking Mode",contentEN:`Add "Think step by step and show your reasoning before answering" to unlock Claude's deeper reasoning. For business decisions, add "List assumptions, risks, then recommendation."

This turns Claude from answer-machine to strategist.`,contentTL:`Idagdag ang "Mag-isip nang dahan-dahan at ipakita ang reasoning bago sumagot" para ma-unlock ang mas malalim na pag-iisip ni Claude. Para sa business decisions, idagdag ang "Ilista ang assumptions, risks, at rekomendasyon."

Nagiging strategist si Claude, hindi lang sumasagot.`,exerciseEN:"Write a prompt that forces Claude to think: Decide if you should price at ₱299 or ₱499. Ask for assumptions, risks, math.",exerciseTL:"Sumulat ng prompt na pinipilit mag-isip si Claude: Pagpasyahan kung ₱299 o ₱499 ang presyo. Humingi ng assumptions, risks, at math.",xp:100}]},{id:"m4",titleEN:"Module 4: Building with Claude",titleTL:"Module 4: Pagbuo Gamit ang Claude",descEN:"Ship products in hours",descTL:"Gumawa ng produkto sa ilang oras",lessons:[{id:"l7",titleEN:"From Idea to Artifact in 30min",titleTL:"Mula Ideya Hanggang Artifact sa 30 Minuto",contentEN:`Workflow:
1. Idea → One-paragraph spec
2. Spec → Claude prompt
3. Artifact → Test with 1 user
4. Feedback → Iterate once
5. Ship

Most people overbuild. You will ship fast.`,contentTL:`Workflow:
1. Ideya → Isang paragraph na spec
2. Spec → Claude prompt
3. Artifact → I-test sa 1 user
4. Feedback → I-iterate nang isang beses
5. I-ship

Karamihan ay sobrang nagbi-build. Ikaw ay mabilis mag-ship.`,exerciseEN:"Pick one idea: habit tracker, budget planner, or client onboarding form. Write its 1-paragraph spec now.",exerciseTL:"Pumili ng isang ideya: habit tracker, budget planner, o client onboarding form. Isulat ang 1-paragraph spec nito ngayon.",xp:125},{id:"l8",titleEN:"Automation Stack",titleTL:"Automation Stack",contentEN:`Connect Claude to Make.com / Zapier:
Claude writes email → Zapier sends → Sheets logs

You can sell "AI automation" packages for ₱5k-15k/mo retainer even as solo.`,contentTL:`I-connect si Claude sa Make.com / Zapier:
Claude magsusulat ng email → Zapier magse-send → Sheets maglo-log

Maaari kang magbenta ng "AI automation" packages na ₱5k-15k/mo retainer kahit solo ka lang.`,exerciseEN:"Map 1 automation: Trigger (new FB lead) → Claude (personalized reply) → Action (GCash invoice). Write steps.",exerciseTL:"I-map ang 1 automation: Trigger (bagong FB lead) → Claude (personalized reply) → Action (GCash invoice). Isulat ang steps.",xp:125}]},{id:"m5",titleEN:"Module 5: Business & Monetization",titleTL:"Module 5: Negosyo at Monetization",descEN:"Sell your skills",descTL:"Ibenta ang skills mo",lessons:[{id:"l9",titleEN:"Packaging Your Offer",titleTL:"Paano I-package ang Offer",contentEN:`Don't sell "prompt engineering". Sell outcomes:
❌ "I will teach you Claude"
✅ "I will build you a client-closing system in 7 days, or money back"

Use the Value Equation: (Dream Outcome x Perceived Likelihood) / (Time Delay x Effort)`,contentTL:`Huwag ibenta ang "prompt engineering". Ibenta ang resulta:
❌ "Tuturuan kitang mag-Claude"
✅ "Gagawan kita ng client-closing system sa 7 araw, o balik pera"

Gamitin ang Value Equation: (Dream Outcome x Perceived Likelihood) / (Time Delay x Effort)`,exerciseEN:'Write your offer in this format: "I help [WHO] achieve [OUTCOME] in [TIME] without [PAIN] using Claude."',exerciseTL:'Isulat ang offer mo sa format na ito: "Tinutulungan ko si [SINO] na makamit ang [RESULTA] sa loob ng [ORAS] nang hindi [SAKIT] gamit si Claude."',xp:150},{id:"l10",titleEN:"Pricing & GCash Flow",titleTL:"Pricing at GCash Flow",contentEN:`Pricing tiers that work in PH:
Basic ₱299 - course only
Pro ₱499 - + 1-on-1 audit
Reseller ₱999 - 100% profit, you keep sales

Always collect via GCash/Maya first, then send access code. No code without payment screenshot.`,contentTL:`Mga pricing tier na epektibo sa PH:
Basic ₱299 - course lang
Pro ₱499 - + 1-on-1 audit
Reseller ₱999 - 100% tubo, sa'yo ang benta

Laging kolektahin muna via GCash/Maya bago magbigay ng access code. Walang code kung walang screenshot ng bayad.`,exerciseEN:'Write your GCash message: "Hi! Paid na po ₱___ , eto screenshot. Pa-send po ng access code. Salamat!" - make it buyer-ready.',exerciseTL:'Isulat ang GCash message mo: "Hi! Paid na po ₱___ , eto screenshot. Pa-send po ng access code. Salamat!" - gawing handa na sa buyer.',xp:150}]},{id:"m6",titleEN:"Module 6: Mastery & Next Steps",titleTL:"Module 6: Pagiging Eksperto at Susunod na Hakbang",descEN:"Become the go-to person",descTL:"Maging go-to person",lessons:[{id:"l11",titleEN:"Building in Public",titleTL:"Pagbuo sa Harap ng Publiko",contentEN:`Post 1 artifact per week on FB/LinkedIn. Template:
"Day X building with Claude: Today I made [artifact] for [niche]. Here's what I learned..."

Consistency > virality. 12 weeks = authority.`,contentTL:`Mag-post ng 1 artifact kada linggo sa FB/LinkedIn. Template:
"Day X building with Claude: Ngayon gumawa ako ng [artifact] para sa [niche]. Ito ang natutunan ko..."

Consistency > virality. 12 linggo = authority.`,exerciseEN:"Write your Day 1 post now. Keep it under 80 words. End with question.",exerciseTL:"Isulat ang Day 1 post mo ngayon. Wala pang 80 salita. Tapusin ng tanong.",xp:200},{id:"l12",titleEN:"Your Certification & Scale Plan",titleTL:"Sertipikasyon at Plano ng Pag-scale",contentEN:`You are ready. Your scale path:
1. Get 5 testimonials (₱299 students)
2. Raise to ₱499 with audit
3. Offer reseller license ₱999
4. Bundle 1-on-1 for ₱2,999

Certificate is below - auto-filled with your login name. Download and post it.`,contentTL:`Handa ka na. Ito ang scale path mo:
1. Kumuha ng 5 testimonial (₱299 students)
2. Itaas sa ₱499 na may audit
